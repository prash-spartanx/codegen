name: ticket-api

description: >
  A tiny issue-tracking REST API. Authenticated users can report tickets,
  optionally assign them to another user, update tickets they reported, and
  close tickets they reported or were assigned. Ticket status is controlled by
  the server.

pythonVersion: "3.12"

services:
  - tickets

entities:
  - name: User
    fields:
      - name: id
        type: int
        primaryKey: true
        nullable: false
        unique: true
        defaultValue: null
      - name: name
        type: str
        primaryKey: false
        nullable: false
        unique: false
        defaultValue: null
      - name: email
        type: str
        primaryKey: false
        nullable: false
        unique: true
        defaultValue: null
      - name: password
        type: str
        primaryKey: false
        nullable: false
        unique: false
        defaultValue: null
    relationships: []

  - name: Ticket
    fields:
      - name: id
        type: int
        primaryKey: true
        nullable: false
        unique: true
        defaultValue: null
      - name: title
        type: str
        primaryKey: false
        nullable: false
        unique: false
        defaultValue: null
      - name: priority
        type: int
        primaryKey: false
        nullable: false
        unique: false
        defaultValue: 1
      - name: status
        type: str
        primaryKey: false
        nullable: false
        unique: false
        defaultValue: "open"
        readOnly: true
      - name: reporter_id
        type: int
        primaryKey: false
        nullable: false
        unique: false
        defaultValue: null
      - name: assignee_id
        type: int
        primaryKey: false
        nullable: true
        unique: false
        defaultValue: null
    relationships:
      - type: many_to_one
        target: User
        field: reporter
      - type: many_to_one
        target: User
        field: assignee

routers:
  - name: auth
    prefix: /auth
    authRequired: false
    dependsOn: []
    endpoints:
      - method: POST
        path: /register
        handler: register_user
        requestBody: UserCreate
        responseBody: UserResponse
      - method: POST
        path: /login
        handler: login_user
        requestBody: UserLogin
        responseBody: TokenResponse

  - name: tickets
    prefix: /tickets
    authRequired: true
    dependsOn:
      - auth
    endpoints:
      - method: POST
        path: /
        handler: create_ticket
        requestBody: TicketCreate
        responseBody: TicketResponse
      - method: GET
        path: /
        handler: list_tickets
        requestBody: null
        responseBody: TicketListResponse
      - method: PATCH
        path: /{ticket_id}
        handler: update_ticket
        requestBody: TicketUpdate
        responseBody: TicketResponse
      - method: POST
        path: /{ticket_id}/close
        handler: close_ticket
        requestBody: null
        responseBody: TicketResponse

serviceLogics:
  - name: create_ticket
    dependsOn: []
    methods:
      - name: create_ticket
        params:
          - name: ticket_data
            type: TicketCreate
          - name: current_user
            type: User
        returns: Ticket
        intent: Create a ticket reported by the current user. If assignee_id is given, a user with that id must exist.

  - name: list_tickets
    dependsOn:
      - create_ticket
    methods:
      - name: list_tickets
        params:
          - name: current_user
            type: User
        returns: list[Ticket]
        intent: Return all tickets reported by or assigned to the current user.

  - name: update_ticket
    dependsOn:
      - create_ticket
    methods:
      - name: update_ticket
        params:
          - name: ticket_id
            type: int
          - name: ticket_data
            type: TicketUpdate
          - name: current_user
            type: User
        returns: Ticket
        intent: Update a ticket reported by the current user. If assignee_id is changed, a user with that id must exist.

  - name: close_ticket
    dependsOn:
      - create_ticket
    methods:
      - name: close_ticket
        params:
          - name: ticket_id
            type: int
          - name: current_user
            type: User
        returns: Ticket
        intent: Close a ticket that was reported by or assigned to the current user by setting its status to closed. Reject if it is already closed.

jwtAuth:
  secretEnv: JWT_SECRET
  algorithm: HS256
  accessTokenExpirationMinutes: 30
  refreshTokenExpirationDays: 7

rateLimiter: null

kafka: null

urlShortener: null

apiGateway: null